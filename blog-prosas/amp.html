    /* CARD RED LUXURY */
    .card{
      position:relative;
      background:linear-gradient(180deg, rgba(198,40,40,0.10), rgba(10,10,10,0.6));
      border:3px solid var(--red);
      border-radius:18px;
      box-shadow:
        0 0 30px var(--red),
        inset 0 0 12px rgba(255, 59, 71, 0.25),
        0 10px 50px rgba(0,0,0,0.7);
      overflow:hidden;
      width:100%;
      padding:20px;
      transition:all .3s ease;
    }
    .card:hover {
      box-shadow:
        0 0 50px var(--red-bright),
        inset 0 0 20px var(--red-bright),
        0 10px 60px rgba(0,0,0,0.8);
      transform:scale(1.01);
    }

    .card::before{
      content:"";
      position:absolute;
      top:-50%; left:-50%;
      width:200%; height:200%;
      background:radial-gradient(circle at 50% 50%, rgba(255, 59, 71, 0.35), transparent 70%);
      animation:neonWave 6s linear infinite;
      filter:blur(25px);
      z-index:0;
    }

    @keyframes neonWave{
      0%{transform:translateX(-50%) translateY(-50%) rotate(0deg);}
      100%{transform:translateX(-50%) translateY(-50%) rotate(360deg);}
    }

    .hero{display:flex;flex-direction:column;gap:16px;align-items:center;position:relative; z-index:1;}

    /* CTA LOGIN / DAFTAR */
    .cta{display:flex;gap:12px;width:100%;justify-content:center;flex-wrap:wrap;position:relative; z-index:1;}

    .btn{
      flex:1 1 45%;
      display:inline-block;text-decoration:none;text-align:center;
      padding:14px 16px;border-radius:12px;font-weight:700;letter-spacing:.3px;
      border:2px solid transparent;transition:all .25s ease;position:relative;overflow:hidden;
      color:#fff;
      background:#000;
      z-index:1;
    }
    .btn::before{
      content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;
      background:conic-gradient(from 0deg, var(--red), var(--red-bright), #ffffff, var(--red));
      border-radius:14px;z-index:-1;
      filter:blur(8px);
      animation:rotateBorder 2.5s linear infinite;
    }
    .btn::after{
      content:"";position:absolute;top:3px;left:3px;right:3px;bottom:3px;
      background:#000;border-radius:10px;z-index:-1;
    }
    .btn:hover{
      animation:glowPulse 1s infinite;
      transform:translateY(-2px);
    }

    @keyframes rotateBorder{to{transform:rotate(360deg)}}

    @keyframes glowPulse {
      0% { box-shadow: 0 0 30px var(--red), 0 0 60px var(--red-bright); }
      50% { box-shadow: 0 0 60px var(--red-bright), 0 0 120px var(--red-soft); }
      100% { box-shadow: 0 0 30px var(--red), 0 0 60px var(--red-bright); }
    }

    /* GAME / VENDOR BUTTONS */
